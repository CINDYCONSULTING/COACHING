<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Suspendu</title>
    <style>
        body {
            /* Centre le contenu au milieu de l'écran */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f0f0; /* Fond léger pour contraste */
        }

        .message-container {
            /* Styles du message */
            color: #FF0000; /* Rouge vif */
            font-size: 80px; /* Très grosse taille */
            font-family: Arial, sans-serif; /* Police épaisse et lisible */
            font-weight: 900; /* Extra gras */
            text-align: center;
            padding: 20px;
            border: 5px solid #FF0000;
            border-radius: 15px;
            background-color: #FFFFFF;
        }

        .emoji {
            font-size: 1.2em; /* Taille légèrement plus grande pour l'emoji */
            margin-left: 15px;
        }
    </style>
</head>
<body>

    <div class="message-container">
        Le développeur a suspendu le site 
        <span class="emoji">😂</span>
    </div>

</body>
</html>
