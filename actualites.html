<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Actualités - Cindy Consulting</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        body { background: #f8f9fa; padding-top: 70px; }
        .filter-btn { border-radius: 20px; font-weight: 600; margin: 5px; transition: 0.3s; }
        .filter-btn:hover { transform: scale(1.05); }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-danger fixed-top"><div class="container"><a class="navbar-brand" href="/">CINDY CONSULTING</a></div></nav>

    <div class="container mt-4">
        <div class="text-center mb-4">
            <h1 style="font-weight: 900;">ACTUALITÉS</h1>
            <div class="mt-3">
                <button class="btn btn-outline-dark filter-btn" hx-get="/api/news" hx-target="#news-container">Toutes</button>
                <button class="btn btn-outline-danger filter-btn" hx-get="/api/news?type=Alerte" hx-target="#news-container">Alertes</button>
                <button class="btn btn-outline-success filter-btn" hx-get="/api/news?type=Mise à jour" hx-target="#news-container">Mises à jour</button>
                <button class="btn btn-outline-warning filter-btn" hx-get="/api/news?type=Promotion" hx-target="#news-container">Promotions</button>
            </div>
        </div>

        <div id="news-container" hx-get="/api/news" hx-trigger="load" class="row">
            <p class="text-center">Chargement...</p>
        </div>
    </div>
</body>
</html>
